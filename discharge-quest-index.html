<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#bfe6ff">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>재현이의 전역 퀘스트</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/neodgm/neodgm-webfont@latest/neodgm/style.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/galmuri@latest/dist/galmuri.css">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nanum+Pen+Script&display=swap">
<style>
:root{
  --vh:1vh;
  --bg:#bfe6ff; --panel:#fff6e9; --ink:#3a2a2a; --line:#3a2a2a;
  --pink:#ff8fb4; --pinkd:#d9577f; --gold:#ffd447; --mint:#7fd6b0; --sky:#8fc8ff;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;background:#e3dfcf;color:var(--ink);overflow:hidden;
  height:calc(var(--vh)*100);overscroll-behavior:none;}
body{font-family:'NeoDunggeunmo','Galmuri11','Galmuri9',ui-monospace,'Apple SD Gothic Neo','Malgun Gothic',monospace;
  -webkit-user-select:none;user-select:none;touch-action:manipulation;-webkit-text-size-adjust:100%;}
#app{position:fixed;inset:0;height:calc(var(--vh)*100);display:flex;flex-direction:column;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  max-width:520px;margin:0 auto;}
/* HUD */
#hud{flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;padding:8px 12px;gap:8px;color:var(--ink);}
#stageLabel{font-size:12px;letter-spacing:1px;color:#e8e2c8;white-space:nowrap;}
#stars{display:flex;gap:4px;}
#stars canvas{width:18px;height:18px;image-rendering:pixelated;}
.hbtn{font:inherit;font-size:11px;background:transparent;color:#e8e2c8;border:1px solid #6b6656;padding:3px 7px;
  box-shadow:none;cursor:pointer;}
.hbtn:active{transform:translate(2px,2px);box-shadow:none;}
/* stage area */
#stage{flex:1 1 auto;position:relative;min-height:0;display:flex;align-items:center;justify-content:center;overflow:hidden;}
.screen{position:absolute;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;}
.screen.on{display:flex;}
canvas.pix{image-rendering:pixelated;image-rendering:crisp-edges;display:block;}
.frame{border:4px solid #fff;box-shadow:0 0 0 4px #000,6px 6px 0 4px #000;background:#000;position:relative;}
/* controls */
#console{flex:1 1 auto;display:flex;flex-direction:column;min-height:0;padding:12px 12px 0;}
#screen{flex:1 1 auto;display:flex;flex-direction:column;min-height:0;background:#2b2a24;border-radius:14px 14px 14px 14px;padding:8px;
  box-shadow:inset 0 0 0 3px #4a473c,0 6px 0 #b9b3a0;}
#screen #hud{background:#1c1b17;color:#e8e2c8;border-radius:8px 8px 0 0;padding:6px 10px;}
#screen #stage{background:linear-gradient(180deg,#bfe6ff 0%,#ffe1ee 100%);border:3px solid #e8e2c8;border-top:0;border-radius:0 0 8px 8px;}
#controls{flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;padding:18px 18px 16px;}
#controls .dpad{transition:opacity .2s;opacity:.4;}
#controls.on .dpad{opacity:1;}
.abox{display:flex;flex-direction:column;align-items:center;gap:6px;margin-right:6px;}
#bA{width:86px;height:86px;border-radius:50%;background:#8b5552;color:#f3ead6;font:inherit;font-size:30px;border:0;cursor:pointer;
  box-shadow:0 6px 0 #5e3936,inset 0 -4px 0 rgba(0,0,0,.15);touch-action:manipulation;}
#bA:active,#bA.pressed{transform:translateY(5px);box-shadow:0 1px 0 #5e3936;}
.alabel{font-size:11px;color:#6b6656;}
.sound{margin-top:14px;font-size:12px;color:#6b6656;text-align:center;}
.dpad{display:grid;grid-template-columns:repeat(3,54px);grid-template-rows:repeat(3,48px);gap:4px;}
.dbtn{font:inherit;font-size:18px;background:#3a3830;color:#e8e2c8;border:0;border-radius:8px;
  box-shadow:0 5px 0 #1f1e19;touch-action:none;cursor:pointer;padding:0;}
.dbtn.pressed,.dbtn:active{transform:translateY(4px);box-shadow:0 1px 0 #1f1e19;background:#4d4a40;}
#bUp{grid-column:2;grid-row:1}#bLeft{grid-column:1;grid-row:2}#bDown{grid-column:2;grid-row:3}#bRight{grid-column:3;grid-row:2}
/* dialog */
#dialog{position:absolute;left:8px;right:8px;bottom:8px;z-index:30;display:none;background:var(--panel);
  border:4px solid #000;box-shadow:inset 0 0 0 3px #fff,4px 4px 0 #000;padding:10px 12px 18px;min-height:86px;cursor:pointer;}
#dialog.on{display:block;}
#dlgWho{display:inline-block;background:var(--pinkd);color:#fff;font-size:12px;padding:2px 8px;margin-bottom:6px;border:2px solid #000;}
#dlgWho.hyun{background:#4c6b3c;}
#dlgWho.sys{background:#7a62c9;}
#dlgText{font-size:15px;line-height:1.55;word-break:keep-all;white-space:pre-wrap;}
#dlgNext{position:absolute;right:10px;bottom:4px;font-size:12px;animation:blink 0.8s steps(2) infinite;}
@keyframes blink{50%{opacity:0}}
/* title */
#title h1{font-size:26px;color:#fff;text-align:center;margin:0 0 6px;text-shadow:3px 3px 0 var(--pinkd),5px 5px 0 #000;line-height:1.3;}
#title .sub{color:var(--ink);font-size:13px;margin-bottom:16px;text-align:center;}
.bigbtn{font:inherit;font-size:16px;background:var(--gold);color:#000;border:3px solid #000;box-shadow:4px 4px 0 #000;
  padding:10px 22px;margin:6px;cursor:pointer;min-width:180px;}
.bigbtn.alt{background:var(--panel);}
.bigbtn:active{transform:translate(4px,4px);box-shadow:none;}
#titleArt{margin:10px 0 18px;}
/* item scenes */
.scene{position:relative;}
.item{position:absolute;background:none;border:0;padding:0;cursor:pointer;touch-action:manipulation;}
.item canvas{width:100%;height:100%;}
.item:active{transform:scale(0.92);}
.item.found{animation:bounce .5s ease 2;}
@keyframes bounce{50%{transform:translateY(-8px)}}
.mission{position:absolute;top:8px;left:8px;right:8px;z-index:5;background:rgba(0,0,0,.72);color:#fff;font-size:13px;
  padding:6px 8px;border:2px solid #fff;text-align:center;word-break:keep-all;}
/* item name label (hover / tap) */
.item::after{content:attr(data-name);position:absolute;left:50%;bottom:100%;transform:translate(-50%,-4px);background:#000;color:#fff;
  font-size:11px;padding:3px 7px;white-space:nowrap;border:2px solid #fff;pointer-events:none;opacity:0;transition:opacity .15s;z-index:9;}
@media (hover:hover){.item:hover::after{opacity:1;}}
.item.show::after,.item:focus-visible::after{opacity:1;}
.polaroid{background:#fff;padding:12px 12px 10px;border:3px solid #000;box-shadow:6px 6px 0 #000;transform:rotate(-2deg);margin:4px 0 22px;width:min(84%,330px);}
.polaroid canvas{width:100%;height:auto;border:2px solid #000;}
.polaroid .cap{text-align:center;font-size:16px;margin-top:8px;color:var(--pinkd);}
.bonus{font-size:12px;color:#fff;background:#7a62c9;border:2px solid #000;padding:2px 8px;margin-bottom:8px;}
/* bonus quiz */
#bonus .qbox{background:var(--panel);border:4px solid #000;box-shadow:inset 0 0 0 3px #fff,6px 6px 0 #000;padding:16px;width:min(92%,420px);}
#bonus .qq{font-size:17px;text-align:center;margin:4px 0 12px;line-height:1.5;word-break:keep-all;}
#bonus .qq small{font-size:13px;color:var(--pinkd);}
.bonusTag{text-align:center;color:#fff;background:#9b5de5;border:2px solid #000;margin:-4px auto 8px;width:max-content;padding:2px 10px;font-size:13px;}
#bonus .opt{display:flex;justify-content:space-between;width:100%;font:inherit;font-size:15px;margin:8px 0;padding:11px;background:#fff;border:3px solid #000;box-shadow:3px 3px 0 #000;cursor:pointer;text-align:left;}
#bonus .opt:active{transform:translate(3px,3px);box-shadow:none;}
#bonus .opt.right{background:#d9c6ff;} #bonus .opt.wrong{background:#ffd0d0;animation:shake .35s;}
#bonusMsg{min-height:22px;text-align:center;font-size:14px;margin-top:6px;color:#7a3fc4;}
#photoModal{position:absolute;inset:0;z-index:45;display:none;background:rgba(255,236,246,.92);overflow-y:auto;-webkit-overflow-scrolling:touch;}
#photoModal.on{display:block;}
.pmInner{display:flex;flex-direction:column;align-items:center;padding:16px 0 24px;}
.pmTitle{font-size:18px;color:#fff;background:#9b5de5;border:3px solid #000;box-shadow:3px 3px 0 #000;padding:4px 12px;margin-bottom:14px;}
#pmPhotos{display:flex;flex-direction:column;align-items:center;gap:6px;width:100%;}
#pmPhotos .polaroid{width:min(74%,280px);margin:6px 0 14px;}
#pmPhotos .polaroid:nth-child(even){transform:rotate(2.5deg);}
.hand{font-family:'Nanum Pen Script',cursive;font-size:24px;color:#4a3a4e;text-align:center;margin-top:6px;line-height:1.1;}
/* hidden note */
.noteArea{width:min(92%,420px);display:flex;flex-direction:column;align-items:center;margin:-10px 0 18px;}
.noteHint{font-size:13px;color:#7a3fc4;text-align:center;line-height:1.5;margin:14px 0 6px;animation:wiggle 1.4s ease-in-out infinite;}
@keyframes wiggle{50%{transform:translateY(3px)}}
.noteClip{width:86%;height:40px;overflow:hidden;position:relative;transition:height .45s cubic-bezier(.2,1.3,.4,1);}
.noteClip.dragging{transition:none;}
.note{background:#f3ecff;border:3px solid #000;box-shadow:4px 4px 0 #000;background-image:repeating-linear-gradient(#f3ecff 0 26px,#d9c6ff 26px 28px);}
.noteTab{height:34px;display:flex;align-items:center;justify-content:center;background:#9b5de5;color:#fff;font-size:14px;cursor:grab;touch-action:none;border-bottom:3px solid #000;}
.noteBody{padding:14px 16px 16px;text-align:center;}
.noteTo,.noteFrom{font-family:'Nanum Pen Script',cursive;font-size:24px;color:#7a3fc4;}
.noteFrom{text-align:right;}
#finalBox{font-family:'Nanum Pen Script',cursive;font-size:30px;line-height:1.35;color:#3a2a2a;word-break:keep-all;margin:6px 0;}
.noteArea.opened .noteHint{animation:none;}
#toast{position:absolute;left:50%;top:38%;transform:translate(-50%,-50%) scale(.9);z-index:60;background:#fff;border:3px solid #000;
  box-shadow:4px 4px 0 #000;padding:10px 14px;font-size:14px;line-height:1.5;text-align:center;width:max-content;max-width:86%;
  word-break:keep-all;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;}
#toast.on{opacity:1;transform:translate(-50%,-50%) scale(1);}
@media (max-height:620px){ #bA{width:70px;height:70px;font-size:24px;} .dpad{grid-template-columns:repeat(3,46px);grid-template-rows:repeat(3,40px);} #controls{padding:12px 16px 10px;} }
@media (min-width:600px){ #app{max-width:440px;} }
/* quiz */
#quiz .qbox{background:var(--panel);border:4px solid #000;box-shadow:inset 0 0 0 3px #fff,6px 6px 0 #000;padding:16px;width:min(92%,420px);}
#quiz .qq{font-size:17px;text-align:center;margin:4px 0 14px;word-break:keep-all;line-height:1.5;}
#quiz .opt{display:block;width:100%;font:inherit;font-size:15px;margin:8px 0;padding:11px;background:#fff;border:3px solid #000;
  box-shadow:3px 3px 0 #000;cursor:pointer;text-align:left;}
#quiz .opt:active{transform:translate(3px,3px);box-shadow:none;}
#quiz .opt.wrong{background:#ffb3b3;animation:shake .35s;}
#quiz .opt.right{background:var(--mint);}
#quizMsg{min-height:24px;text-align:center;font-size:15px;margin-top:6px;color:var(--pinkd);}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
/* clear overlay */
#clear{position:absolute;inset:0;z-index:40;display:none;align-items:center;justify-content:center;flex-direction:column;background:rgba(255,225,238,.75);}
#clear.on{display:flex;}
#clear .ctext{color:var(--gold);font-size:28px;text-shadow:3px 3px 0 #000;margin-bottom:6px;}
#clear .csub{color:var(--ink);font-size:14px;margin-bottom:14px;}
#bigStar{width:96px;height:96px;animation:pop .6s ease;}
@keyframes pop{0%{transform:scale(0) rotate(-90deg)}70%{transform:scale(1.3) rotate(10deg)}100%{transform:scale(1)}}
#fx{position:absolute;inset:0;pointer-events:none;z-index:50;width:100%;height:100%;}
/* ending */
#ending{justify-content:flex-start;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:16px 0 24px;}
#ending .etitle{color:var(--gold);font-size:24px;text-shadow:3px 3px 0 #000;margin:8px 0 12px;text-align:center;}
.letter{background:var(--panel);border:4px solid #000;box-shadow:inset 0 0 0 3px #fff,6px 6px 0 #000;padding:18px 16px;width:min(92%,420px);
  font-size:15px;line-height:1.8;white-space:pre-wrap;word-break:keep-all;margin-bottom:16px;}
.finalq{color:var(--pinkd);font-size:18px;line-height:1.7;text-align:center;padding:10px 18px;margin:6px 16px 20px;word-break:keep-all;background:#fff;border:3px solid #000;box-shadow:4px 4px 0 #000;}
.fade{opacity:0;transform:translateY(10px);transition:opacity .9s ease,transform .9s ease;}
.fade.in{opacity:1;transform:none;}
</style>
</head>
<body>
<div id="app">
 <div id="console">
  <div id="screen">
  <div id="hud">
    <div id="stageLabel">OPENING</div>
    <div id="stars"></div>
    <button class="hbtn" id="muteBtn" aria-label="음악 켜기/끄기">♪ ON</button>
  </div>
  <div id="stage">
    <!-- TITLE -->
    <div class="screen" id="title">
      <h1>재현이의<br>전역 퀘스트</h1>
      <div class="sub">★ 10월 13일 ★ 워니가 혀니에게</div>
      <canvas class="pix" id="titleArt" width="160" height="80" style="width:240px;height:120px"></canvas>
      <button class="bigbtn" id="btnStart">START</button>
      <button class="bigbtn alt" id="btnContinue" style="display:none">이어하기</button>
      <div class="sound">🔈 사운드를 위해 무음 모드를 해제해주세요</div>
    </div>
    <!-- STAGE 1 -->
    <div class="screen" id="s1">
      <div class="frame" id="s1frame"><canvas class="pix" id="map" width="320" height="384"></canvas></div>
    </div>
    <!-- STAGE 2 -->
    <div class="screen" id="s2">
      <div class="frame scene" id="room"><canvas class="pix" id="roomBg" width="320" height="384"></canvas>
        <div class="mission" id="s2mission"></div></div>
    </div>
    <!-- STAGE 3 -->
    <div class="screen" id="quiz">
      <div class="qbox">
        <div class="qq" id="qq"></div>
        <div id="opts"></div>
        <div id="quizMsg"></div>
      </div>
    </div>
    <!-- BONUS QUIZ -->
    <div class="screen" id="bonus">
      <div class="qbox">
        <div class="bonusTag">★ 깜짝 퀴즈! ★</div>
        <div class="qq">Q. 내가 또 가고 싶은 곳은?<br><small>(2곳 · 복수 정답)</small></div>
        <div id="bopts"></div>
        <div id="bonusMsg"></div>
      </div>
    </div>
    <div id="photoModal"><div class="pmInner">
      <div class="pmTitle" id="pmTitle"></div>
      <div id="pmPhotos"></div>
      <button class="bigbtn" id="pmClose">확인</button>
    </div></div>
    <!-- STAGE 4 -->
    <div class="screen" id="s4">
      <div class="frame scene" id="field"><canvas class="pix" id="fieldBg" width="320" height="384"></canvas>
        <div class="mission" id="s4mission"></div></div>
    </div>
    <!-- ENDING -->
    <div class="screen" id="ending">
      <div class="etitle fade" id="eTitle">★ ALL CLEAR ★</div>
      <div class="fade" id="polaWrap" style="display:flex;flex-direction:column;align-items:center;width:100%">
        <div class="bonus">BONUS CUT 📸</div>
        <div class="polaroid"><canvas class="pix" id="polaCanvas" width="300" height="220"></canvas>
          <div class="cap">짜잔! 전역 축하해 🎉</div></div>
      </div>
      <div class="letter fade" id="letterBox"></div>
      <div class="noteArea fade" id="noteArea">
        <div class="noteHint" id="noteHint">편지 아래에 뭔가 삐죽 나와 있어… 👀<br>쪽지를 아래로 쭉 당겨봐!</div>
        <div class="noteClip" id="noteClip">
          <div class="note" id="note">
            <div class="noteTab" id="noteTab">▼ 당기기 ▼</div>
            <div class="noteBody"><div class="noteTo">To. 여보 💜</div><div id="finalBox"></div><div class="noteFrom">- 혜원 -</div></div>
          </div>
        </div>
      </div>
      <button class="bigbtn fade" id="btnRestart">다시하기</button>
    </div>

    <div id="dialog"><div id="dlgWho"></div><div id="dlgText"></div><div id="dlgNext">터치해서 넘기기 ▼</div></div>
    <div id="clear"><canvas class="pix" id="bigStar" width="16" height="16"></canvas>
      <div class="ctext" id="clearText">STAGE CLEAR!</div>
      <div class="csub" id="clearSub">⭐ 별 1개 획득!</div>
      <button class="bigbtn" id="btnNext">다음으로 ▶</button></div>
    <div id="toast"></div>
    <canvas id="fx"></canvas>
  </div>
  </div>
  <div id="controls">
    <div class="dpad">
      <button class="dbtn" id="bUp" aria-label="위">▲</button>
      <button class="dbtn" id="bLeft" aria-label="왼쪽">◀</button>
      <button class="dbtn" id="bDown" aria-label="아래">▼</button>
      <button class="dbtn" id="bRight" aria-label="오른쪽">▶</button>
    </div>
    <div class="abox"><button id="bA" aria-label="A 버튼 (넘기기/확인)">A</button><div class="alabel">넘기기 · 확인</div></div>
  </div>
 </div>
</div>

<script>
/* =========================================================
   CONFIG — 커플 정보 (여기만 바꾸면 내용이 바뀝니다)
   ========================================================= */
const CONFIG = {
  giver: '워니', player: '혀니', reason: '군대 전역', date: '10월 13일',
  title: '재현이의 전역 퀘스트',
  hero: '재현', npc: '혜원',
  firstPlace: '대전 성심당',
  quiz: { q: '우리가 처음 만난 장소는?', answer: '대전 성심당', wrongs: ['금오공대', '천안', '홍성'] },
  // ▼ 마지막 편지: 여기에 편지를 그대로 붙여 넣으세요 (비워두면 편지 칸 없이 마지막 문구만 나와요)
  letter: `재현아, 전역 진짜 진짜 축하해!

그동안 정말 고생 많았어.
군대에 있는 동안 몸도 마음도 힘든 날이 많았을 텐데
끝까지 잘 버텨줘서 너무 고맙고 자랑스러워.

대전 성심당에서 처음 만났던 날,
성심당 앞에서 손잡았던 순간,
수료식 때 어머니 아버지 앞에서 내가 만든 케이크 같이 먹었던 날까지
하나하나 다 소중한 기억이야.

이제는 기다리는 날 말고
같이 보내는 날들로 더 많이 채워가자.

오늘부터 다시 시작하는 우리 일상도 잘 부탁해, 여보 💜

- 혜원이가`,
  finalLine: '전역 후에도 예쁘게 만나자 화내도 빠르게 화해하자 여보야',
};
const SAVE_KEY = 'hyeoni_discharge_quest_v1';

/* ---------- viewport (100vh / Safari 대응) ---------- */
function setVH(){ document.documentElement.style.setProperty('--vh', (window.innerHeight*0.01)+'px'); fitAll(); }
window.addEventListener('resize', setVH);
window.addEventListener('orientationchange', ()=>setTimeout(setVH,250));
if (window.visualViewport) visualViewport.addEventListener('resize', setVH);
document.addEventListener('gesturestart', e=>e.preventDefault());
document.addEventListener('dblclick', e=>e.preventDefault(), {passive:false});

/* ---------- save ---------- */
let state = { stage: 0, stars: 0 };
function load(){ try{ const s = JSON.parse(localStorage.getItem(SAVE_KEY)); if(s && typeof s.stage==='number') state = {stage:Math.min(Math.max(s.stage,0),6), stars:Math.min(Math.max(s.stars|0,0),4)}; }catch(e){} }
function save(){ try{ localStorage.setItem(SAVE_KEY, JSON.stringify(state)); }catch(e){} }
function resetSave(){ state={stage:0,stars:0}; try{ localStorage.removeItem(SAVE_KEY);}catch(e){} }

/* ---------- pixel sprites ---------- */

function drawSpr(ctx,name,x,y,s=1,flip=false){
  const rows=SPR[name]; const w=rows[0].length;
  for(let j=0;j<rows.length;j++){const r=rows[j];for(let i=0;i<r.length;i++){const c=r[i];if(c==='.')continue;
    ctx.fillStyle=PAL[c]||c; const ix=flip?(w-1-i):i; ctx.fillRect(Math.round(x+ix*s),Math.round(y+j*s),s,s);}}
}
function drawOutline(ctx,name,x,y,s,col){const rows=SPR[name];ctx.fillStyle=col;
  for(let j=0;j<rows.length;j++)for(let i=0;i<rows[j].length;i++){if(rows[j][i]==='.')continue;
    [[1,0],[-1,0],[0,1],[0,-1]].forEach(([a,b])=>ctx.fillRect(x+(i+a)*s,y+(j+b)*s,s,s));}}
function sprCanvas(name,scale,outline){const rows=SPR[name];const pad=outline?scale:0;const c=document.createElement('canvas');
  c.width=rows[0].length*scale+pad*2;c.height=rows.length*scale+pad*2;c.className='pix';const x=c.getContext('2d');
  if(outline) drawOutline(x,name,pad,pad,scale,'#4a3a4e'); drawSpr(x,name,pad,pad,scale);return c;}

/* ---------- audio (BGM은 한 번 시작하면 화면이 바뀌어도 끊기지 않음) ---------- */
let actx=null, master=null, bgmGain=null, muted=false, bgmTimer=null, nextT=0, step=0;
const MEL=[72,null,76,79,77,76,74,null,71,74,77,76,74,72,null,null, 69,null,72,76,74,72,71,null,67,71,74,72,71,69,67,null];
const BAS=[48,55,52,55,45,52,48,52,43,50,47,50,48,55,48,55];
function midi(n){return 440*Math.pow(2,(n-69)/12);}
function ensureAudio(){
  try{
    if(!actx){const AC=window.AudioContext||window.webkitAudioContext; if(!AC)return; actx=new AC();
      master=actx.createGain(); master.gain.value=muted?0:0.9; master.connect(actx.destination);
      bgmGain=actx.createGain(); bgmGain.gain.value=0.09; bgmGain.connect(master);}
    if(actx.state==='suspended') actx.resume();
    // iOS unlock
    const b=actx.createBuffer(1,1,22050), src=actx.createBufferSource(); src.buffer=b; src.connect(actx.destination); src.start(0);
    if(!bgmTimer){ nextT=actx.currentTime+0.1; bgmTimer=setInterval(scheduleBGM,40); }
  }catch(e){}
}
function tone(freq,t,dur,type,gain,dest){const o=actx.createOscillator(),g=actx.createGain();o.type=type;o.frequency.value=freq;
  g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(gain,t+0.01);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(g);g.connect(dest);o.start(t);o.stop(t+dur+0.02);}
function scheduleBGM(){
  if(!actx||actx.state!=='running')return; const spb=0.19;
  while(nextT<actx.currentTime+0.25){
    const m=MEL[step%MEL.length]; if(m) tone(midi(m),nextT,spb*0.9,'square',0.5,bgmGain);
    if(step%2===0) tone(midi(BAS[(step/2)%BAS.length]),nextT,spb*1.8,'triangle',0.9,bgmGain);
    nextT+=spb; step++;
  }
}
function sfx(kind){ if(!actx||muted)return; const t=actx.currentTime;
  if(kind==='star'){[76,79,84,88].forEach((n,i)=>tone(midi(n),t+i*0.09,0.25,'square',0.25,master));}
  else if(kind==='wrong'){tone(180,t,0.18,'sawtooth',0.2,master);tone(140,t+0.12,0.25,'sawtooth',0.2,master);}
  else if(kind==='tap'){tone(880,t,0.05,'square',0.12,master);}
  else if(kind==='step'){tone(220,t,0.04,'triangle',0.15,master);}
  else if(kind==='bump'){tone(110,t,0.08,'square',0.12,master);}
  else if(kind==='fanfare'){[72,76,79,84,79,84,88].forEach((n,i)=>tone(midi(n),t+i*0.12,0.3,'square',0.25,master));}
}

function fitBox(el,w,h){ if(!el)return; const st=$('stage'); const aw=st.clientWidth-24, ah=st.clientHeight-24;
  const sc=Math.max(0.3,Math.min(aw/w,ah/h)); el.style.width=Math.floor(w*sc)+'px'; el.style.height=Math.floor(h*sc)+'px'; }

let dlgQueue=[], dlgDone=null, typing=null, fullText='', dlgOpen=false;
function say(lines,done){ dlgQueue=lines.slice(); dlgDone=done||null; dlgOpen=true; $('dialog').classList.add('on'); nextLine(); }
function nextLine(){
  if(!dlgQueue.length){ $('dialog').classList.remove('on'); dlgOpen=false; const d=dlgDone; dlgDone=null; d&&d(); return; }
  const l=dlgQueue.shift(); const who=$('dlgWho');
  who.textContent=l.who||'★'; who.className = l.who===CONFIG.hero?'hyun':(l.who?'':'sys');
  fullText=l.text; let i=0; $('dlgText').textContent=''; clearInterval(typing);
  typing=setInterval(()=>{ i++; $('dlgText').textContent=fullText.slice(0,i); if(i>=fullText.length){clearInterval(typing);typing=null;} },35);
}
$('dialog').addEventListener('click',e=>{ e.stopPropagation(); sfx('tap');
  if(typing){clearInterval(typing);typing=null;$('dlgText').textContent=fullText;return;} nextLine(); });

function completeStage(n, label){
  if(state.stage!==n) return;            // 중복 획득 방지
  state.stars=n; state.stage=n+1; save(); renderHUD();
  stopMove();
  $('controls').classList.remove('on');
  drawSpr($('bigStar').getContext('2d'),'star',0,0,1);

  $('btnNext').textContent = n===4 ? '깜짝 퀴즈 ▶' : '다음 스테이지 ▶';

}

/* ---------- particle fx ---------- */
let parts=[], fxRun=false;
function burst(count,cx,cy){ const fx=$('fx'); cx=cx??fx.width/2; cy=cy??fx.height*0.42;
  const cols=['#ffd447','#b388ff','#9b5de5','#8fc8ff','#fff','#ff8fb4'];
  for(let k=0;k<count;k++){ const a=Math.random()*Math.PI*2, sp=2+Math.random()*5;
    for(let m=0;m<3;m++) parts.push({x:cx,y:cy,vx:Math.cos(a+m)*sp*(0.5+Math.random()),vy:Math.sin(a+m)*sp*(0.5+Math.random())-2,
      life:60+Math.random()*40,c:cols[(Math.random()*cols.length)|0],s:Math.random()<0.12?'star':'sq'}); }
  if(!fxRun){fxRun=true;requestAnimationFrame(fxLoop);} }
function fxLoop(){ const fx=$('fx'),c=fx.getContext('2d'); c.clearRect(0,0,fx.width,fx.height);
  parts=parts.filter(p=>p.life>0); parts.forEach(p=>{ p.x+=p.vx;p.y+=p.vy;p.vy+=0.12;p.vx*=0.98;p.life--; c.globalAlpha=Math.min(1,p.life/30);
    if(p.s==='star') drawSpr(c,'star',p.x-8,p.y-8,1); else {c.fillStyle=p.c;c.fillRect(p.x|0,p.y|0,4,4);} });
  c.globalAlpha=1; if(parts.length) requestAnimationFrame(fxLoop); else {fxRun=false;c.clearRect(0,0,fx.width,fx.height);} }

let hero={x:4,y:10,px:0,py:0,dir:1,anim:0}, won={x:4,y:5}, moving=false, s1done=false, s1raf=null, heldDir=null, holdTimer=null;
function solid(x,y){ const r=MAP[y]; if(!r)return true; const c=r[x]; if(c===undefined)return true;
  return 'TBtbL'.includes(c) || (x===won.x&&y===won.y); }
function drawMap(){
  const c=$('map').getContext('2d'); c.imageSmoothingEnabled=false;
  // ground
  for(let y=0;y<12;y++)for(let x=0;x<10;x++){ c.fillStyle=((x+y)%2)?'#9bd27a':'#8fc96e'; c.fillRect(x*T,y*T,T,T); }
  // path
  c.fillStyle='#e8d6a8'; c.fillRect(4*T+4,5*T,T-8,6*T); c.fillRect(1*T,7*T+6,8*T,T-12);
  for(let y=0;y<12;y++)for(let x=0;x<10;x++){ const ch=MAP[y][x];
    if(ch==='T'){ drawSpr(c,'tree',x*T+4,y*T+1,2); }
    if(ch==='t'){ drawSpr(c,'tree',x*T+4,y*T+1,2); }
    if(ch==='b'){ drawSpr(c,'bench',x*T+4,y*T+10,2); }
    if(ch==='L'){ drawSpr(c,'streetlamp',x*T+11,y*T+6,2); } }
  // 성심당 building (cols 2-6, rows 2-4)
  const bx=2*T,by=2*T,bw=5*T,bh=3*T;
  c.fillStyle='#000';c.fillRect(bx-2,by-2,bw+4,bh+4);
  c.fillStyle='#f3e3c3';c.fillRect(bx,by,bw,bh);
  c.fillStyle='#b34a3a';c.fillRect(bx-6,by-4,bw+12,22); // roof
  for(let i=0;i<bw+12;i+=12){c.fillStyle=(i/12)%2?'#fff':'#e05a48';c.fillRect(bx-6+i,by+18,12,10);} // awning
  c.fillStyle='#3a2a2a';c.fillRect(bx+20,by+30,bw-40,26); // sign
  c.fillStyle='#ffd447';c.font='bold 17px NeoDunggeunmo, Galmuri11, monospace';c.textAlign='center';c.textBaseline='middle';
  c.fillText(CONFIG.firstPlace.replace('대전 ',''),bx+bw/2,by+44);
  c.fillStyle='#8fc8ff';c.fillRect(bx+12,by+64,30,22);c.fillRect(bx+bw-42,by+64,30,22); // windows
  c.fillStyle='#6b4226';c.fillRect(4*T+4,by+62,T-8,bh-62); // door
  c.fillStyle='#ffd447';c.fillRect(4*T+T-12,by+76,3,3);
  // won
  drawSpr(c,'won',won.x*T+4,won.y*T,2);
  if(!s1done){ const bob=Math.sin(Date.now()/250)*2; drawSpr(c,'heart',won.x*T+9,won.y*T-14+bob,2); }
  // hero
  const fr=(hero.anim>0&&Math.floor(Date.now()/120)%2)?2:0;

function px(c,x,y,w,h,col){ c.fillStyle=col; c.fillRect(Math.round(x),Math.round(y),w,h); }
function nightBg(c,seed){
  const g=c.createLinearGradient(0,0,0,200); g.addColorStop(0,'#3d4a7a'); g.addColorStop(0.5,'#5c6aa0'); g.addColorStop(1,'#2a2f4f');
  c.fillStyle=g; c.fillRect(0,0,200,200);
  // mountains
  c.fillStyle='#2b3157'; for(let x=0;x<200;x+=4){ const h=72+Math.sin(x/23)*6+Math.sin(x/9)*3; c.fillRect(x,h,4,200-h); }
  // city lights
  const r=rng(seed);
  c.fillStyle='#1f2440'; c.fillRect(0,86,200,114);
  for(let i=0;i<420;i++){ const x=r()*200, y=88+Math.pow(r(),0.8)*110; const col=r()<0.75?'#ffe08a':(r()<0.5?'#ffffff':'#ff7aa8'); px(c,x,y,2,2,col); }
  // railway lights (bottom)
  for(let k=0;k<4;k++){ c.fillStyle='rgba(255,240,180,.75)'; c.fillRect(0,168+k*8,200,2); }
  // tall building on left
  c.fillStyle='#55618f'; c.fillRect(0,0,26,200); c.fillStyle='#8a97c6'; for(let y=6;y<200;y+=14) c.fillRect(2,y,22,2);
  // window frame
  c.fillStyle='#161a2a'; c.fillRect(150,0,6,200);
  // glass reflection
  c.fillStyle='rgba(255,255,255,.06)'; c.fillRect(40,0,30,200);
}
const PHOTO={
  night1(c){ c.imageSmoothingEnabled=false; nightBg(c,7); drawSpr(c,'wonHeart',64,74,5); },
  night2(c){ c.imageSmoothingEnabled=false; nightBg(c,21); drawSpr(c,'wonCheek',66,74,5); },
  ramen(c){ c.imageSmoothingEnabled=false; const r=rng(5);
    c.fillStyle='#c98f4e'; c.fillRect(0,0,200,200); for(let y=0;y<200;y+=10){c.fillStyle='#b97f42';c.fillRect(0,y,200,2);}
    // drink bottle + glass
    px(c,128,10,22,52,'#e8a43a'); px(c,132,4,14,8,'#fff'); px(c,130,24,18,14,'#ffd447');
    px(c,20,30,26,34,'rgba(255,255,255,.35)'); px(c,22,42,22,20,'#a8692a');
    // plate + bowl
    px(c,24,150,152,22,'#f4f4f4'); px(c,18,82,164,78,'#000'); px(c,20,84,160,74,'#fff');
    for(let x=24;x<176;x+=8){ px(c,x,88,6,4,'#2c5fb3'); px(c,x+3,94,4,3,'#2c5fb3'); }
    // spicy broth
    px(c,30,98,140,48,'#ff5a2a'); px(c,34,102,132,40,'#ff7a3d');
    for(let i=0;i<40;i++) px(c,34+r()*130,104+r()*36,3,2,'#ffb347');
    // charred meat pile
    for(let i=0;i<70;i++){ const x=44+r()*100,y=96+r()*34,w=6+r()*10; px(c,x,y,w,5,r()<0.5?'#5b2e1a':'#3a1d10'); if(r()<0.4) px(c,x+1,y,w-2,2,'#8a4a24'); if(r()<0.3) px(c,x,y+3,3,2,'#14090a'); }
    for(let i=0;i<20;i++) px(c,48+r()*100,96+r()*34,2,2,'#fff1d6'); // glossy
    // egg
    px(c,140,98,22,18,'#fff7e6'); px(c,145,102,12,10,'#f2a019'); px(c,148,104,6,5,'#e36b0d');
    // steam
    c.fillStyle='rgba(255,255,255,.6)'; [[70,60],[96,52],[122,62]].forEach(([x,y])=>{ c.fillRect(x,y,3,12); c.fillRect(x+3,y-8,3,10); c.fillRect(x,y-16,3,8); });
  },
  gyudon(c){ c.imageSmoothingEnabled=false; const r=rng(11);
    c.fillStyle='#c98f4e'; c.fillRect(0,0,200,200); for(let y=0;y<200;y+=10){c.fillStyle='#b97f42';c.fillRect(0,y,200,2);}
    // can + cups
    px(c,8,10,30,48,'#1f8a4c'); px(c,8,10,30,6,'#c8c8c8'); px(c,12,28,22,6,'#fff');
    px(c,150,6,40,30,'#f4f4f4'); px(c,152,12,36,2,'#ddd');
    // bowl
    px(c,24,154,152,20,'#f4f4f4'); px(c,18,58,164,104,'#000'); px(c,20,60,160,100,'#fff');
    for(let x=24;x<176;x+=8){ px(c,x,64,6,4,'#2c5fb3'); px(c,x+3,70,4,3,'#2c5fb3'); px(c,x,150,6,4,'#2c5fb3'); }
    // glazed beef base
    px(c,30,76,140,72,'#3a1d10');
    for(let i=0;i<90;i++){ const x=32+r()*130,y=78+r()*64; px(c,x,y,5+r()*8,4,r()<0.5?'#5b2e1a':'#6e3a1e'); if(r()<0.35) px(c,x+1,y,4,1,'#b06a35'); }
    // garlic chips (top)
    for(let i=0;i<26;i++) px(c,72+r()*30,78+r()*14,4,3,r()<0.5?'#f1d29a':'#e5bd72');
    // pink pickled ginger (center)
    px(c,84,96,24,14,'#ff5c8d'); px(c,88,92,16,6,'#ff7aa3'); px(c,90,100,12,4,'#ffa3c0');
    // sesame (left)
    for(let i=0;i<70;i++) px(c,42+r()*26,96+r()*18,2,2,r()<0.5?'#f2e2bf':'#d8c193');
    // green onion (bottom)
    for(let i=0;i<60;i++) px(c,76+r()*48,120+r()*20,1+((r()*2)|0),4,r()<0.6?'#5fa05a':'#d9f0c8');
    // egg (right)
    px(c,132,80,26,22,'#fff7e6'); px(c,137,85,16,12,'#f2a019'); px(c,141,88,8,6,'#a8551a');
    // shine
    for(let i=0;i<18;i++) px(c,34+r()*130,80+r()*60,2,2,'#ffffff');
  }
};

/* ---- hidden note (pull to open) ---- */
let noteOpen=false;
function noteFull(){ return $('note').offsetHeight; }
function resetNote(){ noteOpen=false; const cl=$('noteClip'); cl.style.height='40px'; $('noteArea').classList.remove('opened');
  $('noteTab').textContent='▼ 당기기 ▼'; $('noteHint').innerHTML='편지 아래에 뭔가 삐죽 나와 있어… 👀<br>쪽지를 아래로 쭉 당겨봐!'; }
function openNote(){ if(noteOpen)return; noteOpen=true; const cl=$('noteClip'); cl.classList.remove('dragging'); cl.style.height=noteFull()+'px';
  $('noteArea').classList.add('opened'); $('noteTab').textContent='💜 숨은 쪽지 발견! 💜'; $('noteHint').textContent='짜잔! 숨은 쪽지 💌';
  sfx('star'); const r=cl.getBoundingClientRect(), st=$('stage').getBoundingClientRect(); burst(12, r.left-st.left+r.width/2, r.top-st.top+40);
  setTimeout(()=>{ const e=$('ending'); e.scrollTo({top:e.scrollTop+120,behavior:'smooth'}); },350); }
(function(){ const tab=$('noteTab'); let y0=null, moved=0;
  tab.addEventListener('pointerdown',e=>{ if(noteOpen)return; y0=e.clientY; moved=0; $('noteClip').classList.add('dragging'); try{tab.setPointerCapture(e.pointerId)}catch(_){} e.preventDefault(); });
  tab.addEventListener('pointermove',e=>{ if(y0===null||noteOpen)return; const dy=Math.max(0,e.clientY-y0); moved=dy;
    $('noteClip').style.height=Math.min(noteFull(),40+dy)+'px'; if(40+dy>noteFull()*0.55){ y0=null; openNote(); } });
  const end=()=>{ if(y0===null)return; y0=null; const cl=$('noteClip'); cl.classList.remove('dragging');
    if(moved<6){ cl.style.height='70px'; setTimeout(()=>{ if(!noteOpen) cl.style.height='40px'; },350); $('noteHint').innerHTML='누르지 말고 아래로 쭉 당겨봐! 👇'; }
    else if(!noteOpen) cl.style.height='40px'; };
  tab.addEventListener('pointerup',end); tab.addEventListener('pointercancel',end);
})();

/* ---------- flow ---------- */
function goStage(n){
  renderHUD(); $('dialog').classList.remove('on'); dlgOpen=false; dlgQueue=[];
  if(n!==1) cancelAnimationFrame(s1raf);
  if(n===0) startOpening(); else if(n===1) startStage1(); else if(n===2) startStage2();
  else if(n===3) startStage3(); else if(n===4) startStage4(); else if(n===5) startBonus(); else startEnding();
}
function startOpening(){
  show('title'); $('btnStart').style.display='none'; $('btnContinue').style.display='none';
  say([{who:null,text:CONFIG.date+', 드디어 '+CONFIG.player+'의 '+CONFIG.reason+' 날!'},
       {who:CONFIG.npc,text:'재현아, 그동안 정말 고생 많았어.\n내가 준비한 작은 게임이 있어!'},
       {who:CONFIG.npc,text:'미션 4개를 클리어하고 별 ⭐ 4개를 모으면 선물이 기다리고 있어.'},
       {who:null,text:'TIP! 대화창이 떠 있을 땐 움직이거나 터치할 수 없어.\n대화창이나 A 버튼을 눌러서 끝까지 읽으면 시작돼!'},
       {who:CONFIG.hero,text:'좋아, 바로 시작하자!'}],
    ()=>{ state.stage=1; save(); goStage(1); });
}
function startTitle(){
  show('title'); renderHUD(); $('stageLabel').textContent='★';
  drawPair('titleArt');
  const has=state.stage>0;
  $('btnStart').style.display=''; $('btnStart').textContent=has?'처음부터':'START';
  $('btnContinue').style.display=has?'':'none';
}
$('btnStart').onclick=()=>{ ensureAudio(); sfx('tap'); resetSave(); renderHUD(); goStage(0); };
$('btnContinue').onclick=()=>{ ensureAudio(); sfx('tap'); goStage(state.stage); };

load(); setVH(); startTitle();
if(document.fonts&&document.fonts.ready) document.fonts.ready.then(()=>{ if(state.stage===2) drawRoom(); if(state.stage===4) drawField(); });
</script>
